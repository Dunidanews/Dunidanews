<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunida News</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#f4f6f9;
}

/* ===== HEADER ===== */
header{
  background:#000;
  color:#fff;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{font-size:22px;font-weight:bold;}
.logo span{color:#e60000;}

.container{
  width:90%;
  margin:40px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.news-card{
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  overflow:hidden;
}

.news-card img{
  width:100%;
  height:auto;
  object-fit:contain;
  background:#eee;
}

.news-content{padding:20px;}

.reactions button{
  border:none;
  background:#f1f1f1;
  padding:6px 12px;
  margin-right:8px;
  border-radius:20px;
  cursor:pointer;
}

footer{
  background:#000;
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top:40px;
  position:relative;
}

/* ===== DASHBOARD DOT ===== */
#adminDot{
  position:absolute;
  right:20px;
  bottom:15px;
  width:18px;
  height:18px;
  background:red;
  border-radius:50%;
  cursor:pointer;
}

/* ===== DASHBOARD PANEL ===== */
#dashboard{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:30px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  display:none;
  width:320px;
  z-index:9999;
}

#dashboard input, #dashboard textarea{
  width:100%;
  margin:8px 0;
  padding:8px;
}

#dashboard button{
  background:#e60000;
  color:#fff;
  border:none;
  padding:8px 15px;
  cursor:pointer;
}

</style>
</head>
<body>

<header>
  <div class="logo">DUNIDA<span>NEWS</span></div>
</header>

<div class="container" id="newsContainer">
</div>

<footer>
© 2026 DUNIDA NEWS NETWORK
<div id="adminDot" onclick="openLogin()"></div>
</footer>

<!-- DASHBOARD -->
<div id="dashboard">
  <div id="loginArea">
    <h3>Admin Login</h3>
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="checkLogin()">Gal</button>
  </div>

  <div id="uploadArea" style="display:none;">
    <h3>Ku Dar War</h3>
    <input type="text" id="title" placeholder="Cinwaanka">
    <textarea id="content" placeholder="Qoraalka"></textarea>
    <input type="file" id="imageInput">
    <button onclick="addNews()">Daabac</button>
  </div>
</div>

<script>

function openLogin(){
  document.getElementById("dashboard").style.display="block";
}

function checkLogin(){
  var pass = document.getElementById("adminPass").value;
  if(pass === "1234"){
    document.getElementById("loginArea").style.display="none";
    document.getElementById("uploadArea").style.display="block";
  }else{
    alert("Password qaldan");
  }
}

function addNews(){
  var title = document.getElementById("title").value;
  var content = document.getElementById("content").value;
  var file = document.getElementById("imageInput").files[0];

  var reader = new FileReader();
  reader.onload = function(e){
    var newsHTML = `
      <div class="news-card">
        <img src="${e.target.result}">
        <div class="news-content">
          <h3>${title}</h3>
          <p>${content}</p>
          <div class="reactions">
            <button onclick="react(this)">👍 <span>0</span></button>
            <button onclick="react(this)">❤️ <span>0</span></button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("newsContainer").innerHTML += newsHTML;
  }
  reader.readAsDataURL(file);
}

function react(btn){
  let span = btn.querySelector("span");
  span.innerText = parseInt(span.innerText) + 1;
}

</script>

</body>
</html>
